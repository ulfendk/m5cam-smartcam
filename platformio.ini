; M5Camera (M5CAM / M5CAM F "fisheye", ESP32-D0WDQ6 + 4 MB PSRAM, OV2640) for SmartCam
[env:m5cam]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots, for OTA updates over HTTP
board_build.f_flash = 40000000L
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    tzapu/WiFiManager@2.0.17
